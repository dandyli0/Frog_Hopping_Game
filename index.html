<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frogg Hopping Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./src/output.css">
    
</head>
<body>
    <h1 class="text-2xl md:text-3xl text-center">Frog Hopping Game</h1>

    <div id="gameboard" class="w-80 md:w-125">

        <div class="tile" data-position="0">
            <div class="lily-pad"></div>
            
        </div>

        <div class="tile" data-position="1">
            <div class="lily-pad"></div>
        </div>

        <div class="tile" data-position="2">
            <div class="lily-pad"></div>
        </div>

        <div class="tile" data-position="3">
            <div class="lily-pad"></div>
        </div>



    </div>

    <p id="position-text">
        Frog position: 0
    </p>
<script src="script.js"></script> 
</body>
</html>
